trigger:
  batch: true
  tags:
    include:
    - '*'
  branches:
    include:
    - main

pr:
  branches:
    include:
    - '*'
  paths:
    include:
    - '*'

stages:
  - stage: Build
    condition: startsWith(variables['Build.SourceBranch'], 'refs/tags/')
    dependsOn: []
    jobs:
#//////////////////////////////////////////////////////////////////////
#// Universal VSIX (all platforms in one package)
#//////////////////////////////////////////////////////////////////////
      - job: Universal
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 30
        variables:
          - name: version
            value: $[ replace(variables['Build.SourceBranch'], 'refs/tags/', '') ]
        steps:
        - task: UseDotNet@2
          inputs:
            version: '9.x'
            includePreviewVersions: true
        - script: dotnet tool restore
          displayName: 'Restore .NET tools'
        - script: npm install -g vsce webpack webpack-cli
          displayName: 'Install Node tools'

        - script: dotnet cake --target=vsix --release-version=$(version) --configuration=release
          displayName: 'Build universal VSIX (all platforms)'
          env:
            NODE_ENV: ''

        - publish: '$(System.DefaultWorkingDirectory)/artifacts'
          displayName: 'Publish Artifacts'
          artifact: 'Universal Build'

#//////////////////////////////////////////////////////////////////////
#// Publish
#//////////////////////////////////////////////////////////////////////
      - job: Publish
        dependsOn: [Universal]
        condition: startsWith(variables['Build.SourceBranch'], 'refs/tags/')
        pool:
          vmImage: ubuntu-latest
        variables:
        - group: secrets
        timeoutInMinutes: 4 
        steps:
        - download: current
          artifact: 'Universal Build'
        - task: GitHubRelease@1
          inputs:
            gitHubConnection: 'upstream'
            repositoryName: '$(Build.Repository.Name)'
            action: 'create'
            tagSource: 'gitTag'
            assets: '$(Pipeline.Workspace)/**/*.vsix'
        - script: npm install -g vsce
          displayName: 'Install VSCode builder'
        - task: Bash@3
          displayName: 'Publish VSIX'
          env:
            VS_TOKEN: $(VSMP_TOKEN)
          inputs:
            targetType: 'inline'
            script: |
              for filename in $(Pipeline.Workspace)/**/*.vsix; do
                vsce publish --packagePath "$filename" -p $VS_TOKEN
              done


  - stage: Tests
    condition: not(startsWith(variables['Build.SourceBranch'], 'refs/tags'))
    dependsOn: []
    jobs:
#//////////////////////////////////////////////////////////////////////
#// MacOS Tests
#//////////////////////////////////////////////////////////////////////
      - job: MacOS
        pool:
          vmImage: macos-latest
        timeoutInMinutes: 10
        steps:
        - task: UseDotNet@2
          inputs:
            version: '9.x'
            includePreviewVersions: true
        - script: dotnet tool restore
          displayName: 'Restore .NET tools'
        - script: dotnet cake --target=test --configuration=release
          displayName: 'Run tests'
          continueOnError: true
        - task: PublishTestResults@2
          inputs:
            testResultsFormat: 'VSTest'
            testResultsFiles: 'artifacts/*.trx'
            failTaskOnFailedTests: true
            failTaskOnMissingResultsFile: true
#//////////////////////////////////////////////////////////////////////
#// Linux Tests
#//////////////////////////////////////////////////////////////////////
      - job: Linux
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 10
        steps:
        - task: UseDotNet@2
          inputs:
            version: '9.x'
            includePreviewVersions: true
        - script: dotnet tool restore
          displayName: 'Restore .NET tools'
        - script: dotnet cake --target=test --configuration=release
          displayName: 'Run tests'
          continueOnError: true
        - task: PublishTestResults@2
          inputs:
            testResultsFormat: 'VSTest'
            testResultsFiles: 'artifacts/*.trx'
            failTaskOnFailedTests: true
            failTaskOnMissingResultsFile: true
#//////////////////////////////////////////////////////////////////////
#// Windows Tests
#//////////////////////////////////////////////////////////////////////
      - job: Windows
        pool:
          vmImage: windows-latest
        timeoutInMinutes: 10
        steps:
        - task: UseDotNet@2
          inputs:
            version: '9.x'
            includePreviewVersions: true
        - script: dotnet tool restore
          displayName: 'Restore .NET tools'
        - script: dotnet cake --target=test --configuration=release
          displayName: 'Run tests'
          continueOnError: true
        - task: PublishTestResults@2
          inputs:
            testResultsFormat: 'VSTest'
            testResultsFiles: 'artifacts/*.trx'
            failTaskOnFailedTests: true
            failTaskOnMissingResultsFile: true
